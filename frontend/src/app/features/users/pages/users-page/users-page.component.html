@if (users$ | async; as users) {
    <input type="text" [formControl]="searchControl">

    @if (users.length === 0) {
        <p>No results</p>
    } @else {
        @for (user of users; track user.id) {
            <p appHighlight>{{ user.name | capitalize }}</p>
        }
    }
} @else {
    <p>Loading...</p>
}
